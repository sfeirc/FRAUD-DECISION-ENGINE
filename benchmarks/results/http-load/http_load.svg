<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"><rect width="100%" height="100%" fill="#0d1b2d"/><text x="20" y="28" fill="#e8f0f8" font-size="17" font-weight="700">Loopback HTTP concurrency benchmark</text><rect x="445" y="18" width="12" height="12" fill="#34d6c6"/><text x="462" y="28" fill="#c9d8e8" font-size="11">throughput</text><rect x="550" y="18" width="12" height="12" fill="#f7b955"/><text x="567" y="28" fill="#c9d8e8" font-size="11">p99 latency</text><rect x="95" y="119.3" width="42" height="110.7" fill="#34d6c6"/><rect x="140" y="218.5" width="42" height="11.5" fill="#f7b955"/><text x="110" y="254" fill="#c9d8e8" font-size="12">c1</text><text x="90" y="58.9" fill="#34d6c6" font-size="10">70.1/s</text><text x="138" y="80.8" fill="#f7b955" font-size="10">23.4ms</text><rect x="240" y="85.0" width="42" height="145.0" fill="#34d6c6"/><rect x="285" y="198.9" width="42" height="31.1" fill="#f7b955"/><text x="255" y="254" fill="#c9d8e8" font-size="12">c4</text><text x="235" y="55.5" fill="#34d6c6" font-size="10">91.9/s</text><text x="283" y="78.9" fill="#f7b955" font-size="10">63.3ms</text><rect x="385" y="86.6" width="42" height="143.4" fill="#34d6c6"/><rect x="430" y="157.3" width="42" height="72.7" fill="#f7b955"/><text x="400" y="254" fill="#c9d8e8" font-size="12">c8</text><text x="380" y="55.7" fill="#34d6c6" font-size="10">90.9/s</text><text x="428" y="74.7" fill="#f7b955" font-size="10">148.0ms</text><rect x="530" y="99.7" width="42" height="130.3" fill="#34d6c6"/><rect x="575" y="85.0" width="42" height="145.0" fill="#f7b955"/><text x="545" y="254" fill="#c9d8e8" font-size="12">c16</text><text x="525" y="57.0" fill="#34d6c6" font-size="10">82.6/s</text><text x="573" y="67.5" fill="#f7b955" font-size="10">295.3ms</text><text x="20" y="285" fill="#8fa7bf" font-size="11">Fresh single-worker process per level; SQLite FULL sync; client and server on one host.</text></svg>