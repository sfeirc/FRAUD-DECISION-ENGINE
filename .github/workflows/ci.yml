name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - name: Formatting
        run: python -m ruff format --check .
      - name: Linting
        run: python -m ruff check .
      - name: Type checking
        shell: bash
        run: |
          set +e
          python -m mypy -p fraud_engine 2>&1 | tee mypy-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=mypy::$line"
            done < mypy-output.txt
          fi
          exit "$status"
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest --cov=fraud_engine --cov-report=term-missing \
            --cov-fail-under=80 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("pytest-output.txt").read_text(encoding="utf-8").splitlines()[-80:]
          output = "\n".join(lines)
          escaped = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest::{escaped}")
          PY
          fi
          exit "$status"
      - name: Build
        run: python -m build
      - name: Dependency security audit
        shell: bash
        run: |
          set +e
          python -m pip_audit 2>&1 | tee audit-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          output = Path("audit-output.txt").read_text(encoding="utf-8")
          escaped = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=dependency audit::{escaped}")
          PY
          fi
          exit "$status"
